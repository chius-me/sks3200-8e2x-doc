name: 页面观察
description: 报告与本文档不一致、或可补充的 WEBUI / 转发行为
title: "[观察] "
labels: ["observation"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量附带固件版本和硬件版本。不要上传未脱敏的配置文件（可能含密码）。
  - type: input
    id: firmware
    attributes:
      label: 固件版本
      placeholder: "例如 2.0.0.1"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: 硬件版本
      placeholder: "例如 A0"
  - type: dropdown
    id: language
    attributes:
      label: Web 界面语言
      options:
        - 简体中文
        - English
        - Русский язык
        - 日本語
        - 한국어
        - 其他 / 未记录
  - type: input
    id: page
    attributes:
      label: 页面
      description: 菜单路径或页面文件名，例如「高级设置 → 标签VLAN」或 tag_based_vlan.html
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: 证据类型
      options:
        - 只看了页面，没有提交
        - 点击了应用 / 确认，但没有保存
        - 点击了保存
        - 重启后核对过
        - 用抓包或对端行为验证过转发
      default: 0
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 你看到了什么
      description: 字段名、选项、当前值、和文档的差异。
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充
      description: 可附截图（打码管理 IP、MAC、账号）。不要粘贴密码。
