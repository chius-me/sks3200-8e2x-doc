site_name: SKS3200-8E2X Docs
site_description: Community configuration docs for the XikeStor SKS3200-8E2X (firmware 2.0.0.1 / hardware A0)
site_url: https://chius-me.github.io/sks3200-8e2x-doc/
repo_url: https://github.com/chius-me/sks3200-8e2x-doc
repo_name: chius-me/sks3200-8e2x-doc
edit_uri: edit/main/docs/

copyright: Community docs, CC BY-SA 4.0. Not affiliated with XikeStor / 兮克.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.tabs.link
    - content.code.copy
    - toc.follow

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: SKS3200-8E2X Docs
        - locale: zh
          name: 简体中文
          build: true
          site_name: SKS3200-8E2X 配置文档
          copyright: 社区文档，采用 CC BY-SA 4.0 许可。与兮克 / XikeStor 无关。
          site_description: 兮克 / XikeStor SKS3200-8E2X 社区配置文档（固件 2.0.0.1 / 硬件 A0）
          theme:
            language: zh
          nav_translations:
            Home: 首页
            Getting started: 入门
            Hardware: 硬件概览
            First login: 第一次登录
            How to read this: 文档怎么读
            Web UI: Web 界面
            Overview: 总览与约定
            System: 系统功能
            Switching: 高级设置
            Status: 状态信息
            Tools: 系统工具
            Guides: 配置指南
            VLAN: VLAN
            Link aggregation: 链路聚合
            Loop protection and STP: 环路与 STP
            Backup and firmware: 备份与升级
            Reference: 参考
            Menu map: 菜单与页面路径
            Firmware families: 固件分代
            Unverified items: 尚未确认
            Field index: 字段索引

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chius-me/sks3200-8e2x-doc

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - Hardware: hardware.md
      - First login: getting-started.md
      - How to read this: methodology.md
  - Web UI:
      - Overview: webui/index.md
      - System: webui/system.md
      - Switching: webui/switching.md
      - Status: webui/status.md
      - Tools: webui/tools.md
  - Guides:
      - VLAN: guides/vlan.md
      - Link aggregation: guides/lag.md
      - Loop protection and STP: guides/loop-protection.md
      - Backup and firmware: guides/backup-and-upgrade.md
  - Reference:
      - Menu map: reference/menu-map.md
      - Firmware families: reference/firmware-families.md
      - Unverified items: reference/known-unknowns.md
      - Field index: reference/field-index.md
